<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">product-timeline：2026 年 5 月到 10 月的事件時間軸</title><desc id="d">2026 年 5 月 19 日到 10 月 28 日的事件時間軸，資料截至 2026-10-25；桌面版點的位置依日期比例排列、標籤上下錯開，手機版改為由上而下的清單。事件依序：05/19 Gemini 3.5 Flash 與 Spark（I/O），標籤：已確認；07/21 Gemini 3.6 Flash，標籤：已確認；07/22 第二季財報：自由現金流 −58.55 億美元，標籤：已確認；08/05 DeepMind 人事公告，標籤：已確認；08/13 Gemini 3.7 Flash，標籤：已確認；09/02 Gemini 3.8 Flash，標籤：已確認；09/08 Meta 推出 Muse，標籤：已確認；09/20 Amazon 封鎖 Muse，標籤：已確認；09/29 白宮超級智慧協議，標籤：已確認；09/30 Argon 公布（先給 Fairwind），標籤：已確認；10/01 Suncatcher 原型衛星發射，標籤：已確認；10/08 Gemini agent 發表，標籤：已確認；10/13 Argon 擴大開放，標籤：已確認；10/16 Waymo 宣布多倫多試驗，標籤：已確認；10/21 本訪談上架，無標籤，以淡黃底標示；10/28 第三季財報（預定），標籤：已確認。標籤顏色：綠色＝已確認。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><line x1="0" y1="0" x2="0" y2="8" stroke="#6b6b6b" stroke-width="3"/></pattern></defs><rect width="900" height="671" fill="#f9f7f4"/><rect x="30.0" y="29.0" width="26.6" height="19.0" fill="#ddefe3" stroke="#7cb394" stroke-width="1.5" rx="4"/><text font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="400"><tspan x="66.6" y="45.1">已確認</tspan></text><path d="M50.0,71.3 L850.0,71.3" fill="none" stroke="#5f5a54" stroke-width="3" stroke-linejoin="round"/><path d="M114.2,64.3 L114.2,78.3" fill="none" stroke="#5f5a54" stroke-width="1.5" stroke-linejoin="round"/><path d="M114.2,78.3 L114.2,655.3" fill="none" stroke="#e2ddd5" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 5"/><path d="M262.3,64.3 L262.3,78