<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 904" width="600" height="904" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">product-timeline：2026 年 5 月到 10 月的事件時間軸</title><desc id="d">2026 年 5 月 19 日到 10 月 28 日的事件時間軸，資料截至 2026-10-25；桌面版點的位置依日期比例排列、標籤上下錯開，手機版改為由上而下的清單。事件依序：05/19 Gemini 3.5 Flash 與 Spark（I/O），標籤：已確認；07/21 Gemini 3.6 Flash，標籤：已確認；07/22 第二季財報：自由現金流 −58.55 億美元，標籤：已確認；08/05 DeepMind 人事公告，標籤：已確認；08/13 Gemini 3.7 Flash，標籤：已確認；09/02 Gemini 3.8 Flash，標籤：已確認；09/08 Meta 推出 Muse，標籤：已確認；09/20 Amazon 封鎖 Muse，標籤：已確認；09/29 白宮超級智慧協議，標籤：已確認；09/30 Argon 公布（先給 Fairwind），標籤：已確認；10/01 Suncatcher 原型衛星發射，標籤：已確認；10/08 Gemini agent 發表，標籤：已確認；10/13 Argon 擴大開放，標籤：已確認；10/16 Waymo 宣布多倫多試驗，標籤：已確認；10/21 本訪談上架，無標籤，以淡黃底標示；10/28 第三季財報（預定），標籤：已確認。標籤顏色：綠色＝已確認。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><line x1="0" y1="0" x2="0" y2="8" stroke="#6b6b6b" stroke-width="3"/></pattern></defs><rect width="600" height="904" fill="#f9f7f4"/><rect x="24.0" y="31.0" width="33.6" height="24.0" fill="#ddefe3" stroke="#7cb394" stroke-width="1.5" rx="4"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400"><tspan x="67.6" y="51.6">已確認</tspan></text><path d="M40.0,92.9 L40.0,876.1" fill="none" stroke="#cfc9c0" stroke-width="3" stroke-linejoin="round"/><circle cx="40.0" cy="96.3" r="9" fill="#7cb394" stroke="#ffffff" stroke-width="2"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400"><tspan x="66.0" y="104.5">05/19　Gemini 3.5 Flash 與 Spark（I/O）</tspan></text><circle cx="40.0" cy="145.2" r="9"